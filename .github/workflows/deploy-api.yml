name: Deploy Halo Vision web app and API

on:
  push:
    branches: [main]
    paths:
      - "CompanionApp/Backend/**"
      - "CompanionApp/Web/**"
      - "Shared/Runtime/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build companion web app
        working-directory: CompanionApp/Web
        run: |
          npm install
          npm run build

      - name: Include web app in API deployment
        run: |
          mkdir -p CompanionApp/Backend/HaloVision.Api/wwwroot
          cp -a CompanionApp/Web/dist/. CompanionApp/Backend/HaloVision.Api/wwwroot/

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish web app and API
        run: dotnet publish CompanionApp/Backend/HaloVision.Api/HaloVision.Api.csproj --configuration Release --output ./publish

      - name: Deploy to Azure App Service
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
